<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Infinity</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Es mejor usar 'defer' para que el JS se ejecute después de cargar el HTML -->
    <script src="infinity.js" defer></script>
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <!-- Tarjeta del Formulario -->
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h2 class="mb-0 fw-bold">Infinity Disco Bar</h2>
                    </div>
                    <div class="card-body p-4">
                        <form>
                            
                            <!-- Campo: Nombre -->
                            <div class="mb-3">
                                <label for="nombre" class="form-label fw-semibold">Nombre</label>
                                <input type="text" class="form-control" id="nombre" placeholder="Ingresa tu nombre completo" required>
                            </div>

                            <!-- Campo: Edad -->
                            <div class="mb-3">
                                <label for="edad" class="form-label fw-semibold">Edad</label>
                                <input type="number" class="form-control" id="edad" placeholder="Ej. 25" min="0" required>
                            </div>

                            <!-- Campo: Mensaje de Buenos Días / Estado -->
                            <div class="mb-3">
                                <label for="mensaje" class="form-label fw-semibold">Mensaje de Estado</label>
                                <textarea class="form-control" id="mensaje" rows="3" placeholder="Aquí aparecerá tu estado..."></textarea>
                            </div>

                            <!-- Campo: Membresía VIP (Radio Buttons) -->
                            <div class="mb-4">
                                <label class="form-label d-block fw-semibold">Tipo de Membresía</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="membresia" id="vip" value="vip" checked>
                                    <label class="form-check-label" for="vip">VIP ✨</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="membresia" id="noVip" value="no-vip">
                                    <label class="form-check-label" for="noVip">No VIP</label>
                                </div>
                            </div>

                            <!-- Botón de Envío -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">Enviar</button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle con Popper (Corregido) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
